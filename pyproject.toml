[project]
name = "tracedb"
version = "0.1.0"
description = "Fast, budgeted, content-addressed trace/data store over S3"
requires-python = ">=3.10"
dependencies = []
[project.optional-dependencies]
s3 = ["boto3"]
zstd = ["zstandard"]
test = ["pytest"]
[project.scripts]
tracedb = "tracedb.cli:main"
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
packages = ["tracedb"]
[tool.pytest.ini_options]
testpaths = ["tests"]
