intro: |
  <a id="video"></a>
  **traceDB** is a store for agent traces and research data that behaves well when an agent, not a person, is the reader. Many small files are
  packed into a few large immutable, content-addressed objects on **S3 (or a local directory)**, a local catalog knows where every byte lives, and
  **every read is capped by a byte budget** so an agent can never accidentally pull a 4 GB log into its context.

  It pairs with [ontolagni](https://github.com/Bobliuuu/ontolagni): *ontolagni says where data is, traceDB fetches it.*
  The design notes are in [DESIGN.md](DESIGN.md); this page summarises what is measured in [`bench/results/`](bench/results).

video:
  url: ""
  caption: "Explainer video (with voice-over and subtitles): why traceDB exists, how it stores and reads, and what we measured"
  mp4: video/tracedb_explainer.mp4
  gif: video/preview.gif
  srt: video/tracedb_explainer.srt
  poster: video/poster.png
  out_dir: video/.render
  fps: 24
  max_mb: 22
  render_crf: 18
  concurrency: 4
  music: true
  voice: {engine: openai, voice: alloy, model: gpt-4o-mini-tts, tempo: 1.15}
  scenes:
    - type: title
      title: traceDB
      subtitle: A byte-budgeted, content-addressed store for agent traces
      chips: [S3 or local, packs + catalog, byte budget, search index]
      say: "traceDB: a fast, byte budgeted, content addressed store for agent traces and research data, on S3 or a local directory. This is a short tour of how it works, what we measured, and what is still unmeasured."
    - type: problem
      heading: The problem
      bullets:
        - "Agent sessions produce huge numbers of small files, plus a few multi-gigabyte ones"
        - "One object per file on S3 means one request per file, and slow listing"
        - "An agent that reads a whole log blows its context and the network"
      say: "Agents leave behind a lot of data. Thousands of small trace files, and now and then a log that is gigabytes long. Storing one S3 object per file means one request per file, and listings are slow. And an agent that reads a whole log by mistake wastes both its context window and the network."
    - type: architecture
      diagram: flow
      heading: "The layout: packs, segments, and one mutable pointer"
      say: "The layout has three kinds of object. Packs are immutable, around thirty two mebibytes, made of one mebibyte blocks that are compressed independently. Segments are immutable catalog deltas that say which path lives in which pack at which offset. And a single small HEAD file lists the segments. HEAD is the only thing that ever changes, and it is updated with compare and swap."
    - type: cards
      heading: "Safe by construction"
      cards:
        - {title: "Crash-safe writes", sub: "packs, then segment, then HEAD", lines: ["A crash before the swap leaves invisible orphans", "Retrying identical content is a no-op"]}
        - {title: "Concurrent writers", sub: "compare-and-swap on HEAD", lines: ["{{ n.writers }} writers on real S3 lost nothing", "{{ n.writer_entries }} of {{ n.writer_entries }} entries present"]}
        - {title: "Byte budget", sub: "default 8 MiB per read", lines: ["Over budget raises with a plan", "Plan shows bytes and requests before any fetch"]}
      footer: "Reads touch only the 1 MiB blocks they need: head, tail and range reads never fetch the whole file"
      say: "Writes are crash safe. Packs are written first, then the segment, then the HEAD swap, so a crash leaves only invisible orphans. Concurrent writers never block each other: on real S3, {{ n.writers }} concurrent writers lost nothing. And every read has a byte budget, eight mebibytes by default. A read over budget fails with a plan that shows the bytes and requests it would have cost."
    - type: terminal
      heading: "Using it"
      lines:
        - {cmd: "export TRACEDB_STORE=s3://bucket/prefix"}
        - {cmd: "tracedb put ./logs --prefix logs/"}
        - {out: "packed into content-addressed packs"}
        - {cmd: "tracedb plan logs/x/y.jsonl"}
        - {out: "raw / wire bytes and request count, no fetch"}
        - {cmd: "tracedb get logs/x/y.jsonl --head 4096"}
        - {out: "first 4 KiB only, one 1 MiB block touched"}
      say: "Using it is simple. Point it at a bucket prefix or a local directory, put a folder, then plan a read to see its cost without fetching anything, and get just the first four kilobytes of a file."
    - type: stat
      number: wire_pct
      kicker: "{{ n.files.text }} files, {{ n.raw_mib.text }}, packed into {{ n.packs.text }} packs"
      label: of the raw bytes on the wire
      sub: "real agent traces and repo data, compressed blockwise"
      say: "On real agent trace and repository data, {{ n.files.numtext }} files and {{ n.raw_mib.numtext }} became {{ n.packs.numtext }} packs, at {{ n.wire_pct.numtext }} percent of the raw size."
    - type: chart
      chart: pulls
      gif: video/pulls.gif
      gif_start: 0.4
      gif_end: 9
      gif_width: 900
      gif_fps: 10
      say: "Here are real S3 pulls from a laptop, where each round trip is about seventy milliseconds. One small file takes {{ n.p1_ms.numtext }} milliseconds, which is one round trip. Five large files, {{ n.big_raw.numtext }} mebibytes of raw data, take {{ n.big_ms.numtext }} milliseconds in {{ n.big_reqs.numtext }} requests. A thousand random small files take {{ n.p1000_ms.numtext }} milliseconds."
    - type: chart
      chart: sweep
      say: "Random small files were the hard case, so we swept two settings: how large a gap between ranges may be coalesced, and how many parallel workers. The earlier setting took {{ n.sw_before.numtext }} milliseconds with {{ n.sw_amp_before.numtext }} times read amplification. The new defaults, sixty four workers and a sixty four kilobyte gap, take {{ n.sw_after.numtext }} milliseconds at {{ n.sw_amp_after.numtext }} times amplification."
    - type: chart
      chart: append
      say: "Agent sessions grow by appending. When new bytes start with the stored bytes, traceDB stores only the tail as a new extent. On the local backend, appending a hundred kilobytes to a forty mebibyte session adds about {{ n.app_kib.numtext }} kibibytes of pack, instead of re storing the whole file. That is roughly {{ n.app_ratio.numtext }} times less, in about {{ n.app_ms.numtext }} milliseconds per put."
    - type: chart
      chart: index_size
      say: "Search is built from the store itself. The version three index is sharded, uses contentless full text search, and dedupes repeated text. On the real store it shrank from {{ n.idx_old_gb.numtext }} gigabytes to {{ n.idx_new_gb.numtext }}, a {{ n.idx_shrink.numtext }} times reduction. A cold first search takes {{ n.idx_cold.numtext }} seconds, against about {{ n.idx_old_cold.numtext }} minutes before."
    - type: caveats
      heading: "Honest caveats"
      bullets:
        - "S3 numbers are from a laptop, so round trip time dominates; in-region runs are still to do"
        - "Recall against the old index is {{ n.idx_recall.text }} at ten, on a store that grew by half since"
        - "Edited, non-prefix files are stored whole; no history API yet"
        - "Several benchmarks ran on a loaded machine"
      say: "Some honest caveats. The S3 numbers come from a laptop, so network round trips dominate, and an in region benchmark is still to do. Recall of the new search index against the old one is {{ n.idx_recall.text }} at ten, on a store that has since grown by half. Files that are edited rather than appended are stored whole, and there is no history API yet."
    - type: end
      title: traceDB
      subtitle: "Pairs with ontolagni: it says where, traceDB fetches"
      say: "traceDB. The code, the design notes and every benchmark file are in the repo."

